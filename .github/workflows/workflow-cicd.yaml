name: Workflow CI/CD

on:
  push:
    branches: [main]

jobs:
  build-analyse:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build Maven
        run: mvn -B clean verify
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Publier le rapport JaCoCo
        uses: actions/upload-artifact@v5
        with:
          name: rapport-jacoco
          path: target/site/jacoco

      - name: Publier le rapport Checkstyle
        uses: actions/upload-artifact@v5
        with:
          name: rapport-checkstyle
          path: |
            target/checkstyle-result.xml
            target/site/checkstyle.html    

      - name: Analyse CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          output: resultats-codeql
          upload: always

      - name: Sauvegarder le rapport CodeQL
        uses: actions/upload-artifact@v5
        with:
          name: rapport-codeql
          path: resultats-codeql